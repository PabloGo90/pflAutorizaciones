version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: mi_postgres_db
    environment:
      POSTGRES_USER: autoriza
      POSTGRES_PASSWORD: autoriza
      POSTGRES_DB: autorizaciones
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: